name: Solace Connector CI

on:
  push:
    branches: [feat/solace-connector]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    name: Check Solace transport
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust ${{ env.MSRV }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: clippy, rustfmt

      - name: Cache Cargo registry and index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-solace-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-solace-${{ runner.os }}-

      # Formatting of the Solace connector files (scoped: the wider repo is
      # formatted by its own tooling and pre-commit hooks).
      - name: Check formatting of Solace files
        run: |
          rustfmt --check --edition 2024 \
            crates/adapters/src/transport/solace/*.rs \
            crates/feldera-types/src/transport/solace.rs

      # solace-rs auto-downloads the Solace C SDK for Linux x64 at build time.
      # --no-default-features avoids pulling in native deps (rdkafka, postgres-cdc, etc.)
      # that are not available on a stock ubuntu runner.
      - name: Check adapters crate with Solace feature
        run: cargo check --locked -p dbsp_adapters --no-default-features --features with-solace

      # Lint gate.  Denies warnings so collapsible-ifs and friends cannot
      # accumulate in the connector code.
      - name: Clippy (with-solace)
        run: cargo clippy --locked -p dbsp_adapters --no-default-features --features with-solace --lib -- -D warnings

      # Compile (but do not run) the broker-gated integration tests so they
      # cannot rot: running them needs a live Solace Platform broker
      # (see transport/solace/test.rs).
      - name: Check Solace integration tests compile
        run: cargo check --locked -p dbsp_adapters --no-default-features --features solace-integration-test --tests

      # Solace connector config unit tests (validation, serde defaults, smf_url
      # scheme). These live in feldera-types and build cleanly.
      - name: Test Solace config types
        run: cargo test --locked -p feldera-types --lib transport::solace

      # Solace transport unit tests (RGMID dedup cache, deferred-ack draining,
      # message disposition, error classification, topic templating).
      #
      # This step requires codegen of the `dbsp` crate, which ICEs on rustc
      # 1.97.x (`instantiate_and_check_impossible_predicates` on
      # StarJoinFuncTrait) — the toolchain pinned above (1.94.1) is known good.
      # The broker-gated integration tests (`--features solace-integration-test`,
      # see transport/solace/test.rs) are NOT run here: they need a live
      # Solace Platform broker.
      - name: Test Solace transport
        run: cargo test --locked -p dbsp_adapters --no-default-features --features with-solace --lib transport::solace

      # Default-feature check: catches breakage in code paths that the
      # --no-default-features builds above never compile (an avro break
      # shipped through exactly this hole).  Needs the native deps that
      # rdkafka/postgres pull in.
      #
      # Runs LAST and on stable, not the 1.94.1 pin: the postgres-cdc etl
      # crates require rustc >= 1.95, and the dbsp ICE that forces the pin
      # only affects `cargo test` codegen (backend-mode), never
      # `cargo check`.  Installing stable changes the default toolchain, so
      # every 1.94.1 step must come before this one.
      - name: Install system dependencies for default features
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libssl-dev pkg-config libclang-dev \
            libsasl2-dev libzstd-dev zlib1g-dev \
            cmake build-essential

      - name: Install Rust stable (default-feature check only)
        uses: dtolnay/rust-toolchain@stable

      - name: Check adapters crate with default features
        run: cargo +stable check --locked -p dbsp_adapters

  build-image:
    name: Build and Push Docker Image
    # Only push on direct pushes — not PRs (PRs from forks don't have GITHUB_TOKEN write access)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Large runner recommended; Rust + Java compile takes ~25 min on a 2-core runner.
    # If you have access to larger GitHub-hosted runners, change to ubuntu-latest-16-cores.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      # ── Java (SQL compiler) ──────────────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Maven
        run: sudo apt-get update -qq && sudo apt-get install -y maven

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-solace-${{ runner.os }}-${{ hashFiles('sql-to-dbsp-compiler/**/pom.xml') }}
          restore-keys: maven-solace-${{ runner.os }}-

      - name: Build SQL compiler jar
        working-directory: ./sql-to-dbsp-compiler
        run: bash build.sh -pl SQL-compiler

      # ── Rust (pipeline-manager) ──────────────────────────────────────────────
      - name: Install Rust 1.94.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Install system dependencies
        run: |
          sudo apt-get install -y \
            libssl-dev pkg-config libclang-dev \
            libsasl2-dev libzstd-dev zlib1g-dev \
            cmake build-essential lld

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      # ── Web console (SvelteKit) ───────────────────────────────────────────────
      # Build the console so the cargo step below embeds it into the
      # pipeline-manager binary, giving the image the native Feldera Web Console
      # at the manager root (http://<host>:8081/). check-bun-version.ts requires
      # bun >= 1.3.3. The generated API client is committed under
      # js-packages/web-console/src/lib/services/manager/, so no codegen is needed.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Build web console
        run: |
          bun install --frozen-lockfile
          # `build` runs prebuild (workspace dep chain) then build:self
          # (svelte-kit sync + vite build) → static output in web-console/build.
          # cd into the member dir: bun's `--cwd` only parses the `=` form; the
          # space form silently prints usage and exits 0 (builds nothing).
          cd js-packages/web-console
          bun run build

      - name: Build pipeline-manager (release)
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
          OPENSSL_NO_VENDOR: "1"
          OPENSSL_STATIC: "1"
          # Embed the pre-built web console (previous step) into the binary.
          # build.rs serves whatever this dir contains; empty dir = no web UI.
          WEBCONSOLE_BUILD_DIR: ${{ github.workspace }}/js-packages/web-console/build
        run: cargo build --release --locked -p pipeline-manager

      # ── Stage build/ artifacts for deploy/Dockerfile ────────────────────────
      - name: Stage build artifacts
        run: |
          mkdir -p build
          cp target/release/pipeline-manager build/
          cp sql-to-dbsp-compiler/SQL-compiler/target/sql2dbsp-jar-with-dependencies.jar build/
          ls -lh build/

      # ── Docker ───────────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/jessemenning/feldera:feat-solace-connector
            ghcr.io/jessemenning/feldera:${{ github.sha }}
          cache-from: type=gha,scope=feldera-docker
          cache-to:   type=gha,mode=max,scope=feldera-docker
        env:
          # plain progress surfaces RUST_LOG heartbeat lines from --precompile
          # in the GHA log so we can tell "compiling" from "stuck"
          BUILDX_PROGRESS: plain
